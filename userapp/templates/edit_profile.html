{% extends 'basetemplate.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="text-center fw-bold mb-4">แก้ไขข้อมูลโปรไฟล์</h3>

        <form method="POST" class="form-container shadow-sm w-100">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="first_name" class="form-label fw-bold">ชื่อจริง:</label>
                    <input type="text" class="form-control" name="first_name" value="{{ request.user.first_name }}" placeholder="ระบุชื่อจริง">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="last_name" class="form-label fw-bold">นามสกุล:</label>
                    <input type="text" class="form-control" name="last_name" value="{{ request.user.last_name }}" placeholder="ระบุนามสกุล">
                </div>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label fw-bold">อีเมล:</label>
                <input type="email" class="form-control" name="email" value="{{ request.user.email }}" placeholder="example@email.com" required>
            </div>

            <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-primary px-4">บันทึกข้อมูล</button>
                <a href="{% url 'profile' %}" class="btn btn-secondary px-4">ยกเลิก</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
