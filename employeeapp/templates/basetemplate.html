<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลพนักงาน</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            width: 50%;
            margin: 20px auto;
            padding: 25px;
            border: 0.5px solid #ccc;
            border-radius: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .alert-container {
            width: 50%;
            margin: 15px auto;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">EMPLOYEE HUB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <!-- เมนูด้านซ้าย -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'index' %}">หน้าหลัก</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'employee' %}">จัดการข้อมูลพนักงาน</a>
                    </li>
                </ul>

                <!-- ช่องค้นหา -->
                <form class="d-flex me-3" method="GET" action="{% url 'index' %}">
                    <input class="form-control me-2" type="search" placeholder="ค้นหาพนักงาน..." name="search">
                    <button class="btn btn-outline-light" type="submit">ค้นหา</button>
                </form>

                <!-- เมนูด้านขวา (ระบบ Authentication) -->
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    {% if request.user.is_authenticated %}
                        <li class="nav-item">
                            <span class="badge bg-primary text-wrap p-2 me-2">สวัสดี, {{ request.user.username }}</span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-danger" href="{% url 'logout' %}">ออกจากระบบ</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'register' %}">สร้างบัญชีผู้ใช้</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">เข้าสู่ระบบ</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
