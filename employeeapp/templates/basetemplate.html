<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EmployeeHub - ระบบจัดการพนักงาน{% endblock %}</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .nav-link {
            font-weight: 400;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #ffd166 !important;
            transform: translateY(-1px);
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.12);
            transition: all 0.3s ease;
            overflow: hidden;
            background: #ffffff;
        }
        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(149, 157, 165, 0.2);
        }
        .btn-modern {
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .search-bar {
            border-radius: 20px;
            padding-left: 15px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .search-bar::placeholder {
            color: rgba(255,255,255,0.7);
        }
        .search-bar:focus {
            background: #ffffff;
            color: #333;
        }
        .badge-dept {
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'index' %}">
                <i class="bi bi-people-fill fs-4 text-warning"></i>
                <span>Employee<span class="text-warning">Hub</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'index' %}">
                            <i class="bi bi-house-door me-1"></i> หน้าหลัก
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'employee' %}">
                            <i class="bi bi-person-plus me-1"></i> เพิ่มพนักงาน
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="{% url 'admin:index' %}" target="_blank">
                            <i class="bi bi-shield-lock me-1"></i> ผู้ดูแลระบบ
                        </a>
                    </li>
                </ul>
                
                <!-- กล่องค้นหา -->
                <form class="d-flex gap-2" method="GET" action="{% url 'index' %}">
                    <div class="input-group">
                        <input class="form-control search-bar" type="search" name="search" placeholder="ค้นหาชื่อพนักงาน..." value="{{ search_query }}">
                        <button class="btn btn-warning text-dark px-3 rounded-pill ms-2 fw-semibold" type="submit">
                            <i class="bi bi-search me-1"></i> ค้นหา
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-4 shadow-sm border-0 d-flex align-items-center" role="alert">
                    <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                    <div>{{ message }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white py-3 text-center text-muted border-top mt-auto">
        <small>© 2026 EmployeeHub - ระบบสารสนเทศจัดการข้อมูลบุคลากร</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
