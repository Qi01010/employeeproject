{% extends 'basetemplate.html' %} 
{% block content %}
<h2 class="text-center fw-bold mb-4">เข้าสู่ระบบ</h2>

{% if messages %}
<div class="alert-container">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}" role="alert">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}

<form method="POST" class="form-container shadow-sm">
    {% csrf_token %}
    <div class="mb-3">
        <label for="username" class="form-label fw-bold">ชื่อ - นามสกุล:</label>
        <input type="text" class="form-control" name="username" placeholder="ระบุชื่อ - นามสกุล ที่ใช้สมัคร" required>
    </div>
    <div class="mb-4">
        <label for="password" class="form-label fw-bold">รหัสผ่าน:</label>
        <input type="password" class="form-control" name="password" placeholder="ระบุรหัสผ่าน" required>
    </div>
    <div class="button-container">
        <button type="submit" class="btn btn-primary w-100 py-2">เข้าสู่ระบบ</button>
    </div>
</form>
{% endblock %}
