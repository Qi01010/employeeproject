{% extends 'basetemplate.html' %}
{% block content %}
<h2 class="text-center fw-bold mb-4">เพิ่มข้อมูลพนักงานใหม่</h2>

<form method="POST" enctype="multipart/form-data" class="form-container shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="button-container">
        <button type="submit" class="btn btn-primary px-4">บันทึกข้อมูล</button>
        <a href="{% url 'index' %}" class="btn btn-secondary px-4">ยกเลิก</a>
    </div>
</form>
{% endblock %}
